name: weekly-signals
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -u scripts/weekly_signals.py
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-signals
          path: out.txt
