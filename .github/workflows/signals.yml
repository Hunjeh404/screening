name: weekly-signals
on:
  workflow_dispatch:
    inputs:
      script:
        default: weekly_signals.py
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4   # 일일 갱신 캐시(재무·시세)를 쓰는 점검 스크립트용
        with:
          path: data/cache
          key: cache-none
          restore-keys: cache-
      - run: python -u scripts/${{ inputs.script }}
      - name: Show result
        run: |
          python - <<'PY'
          lines = open('out.txt', encoding='utf-8').read().splitlines()
          for i in range(0, len(lines), 12):
              print('::warning title=signals ' + str(i // 12) + '::' + '%0A'.join(lines[i:i + 12]))
          PY
