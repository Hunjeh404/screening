name: daily-screen
on:
  schedule:
    - cron: '47 22 * * 1-5'   # 화~토 07:47 (한국시간), 미국 장 마감 후
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - run: |
          set -o pipefail
          python scripts/fetch.py 2>&1 | tee fetch.log || { echo "::error title=fetch.py::$(tail -c 1500 fetch.log | tr '\n' ' ')"; exit 1; }
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: python scripts/screen.py
      - run: python scripts/sectors.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          git push
