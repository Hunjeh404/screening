name: daily-screen
on:
  schedule:
    - cron: '47 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
permissions:
  contents: write
concurrency:
  group: daily-screen
  cancel-in-progress: false
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test rules and history
        run: |
          python -m unittest discover -s tests -v
          node tests/test_ui.cjs
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - name: US data and history
        id: us
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -o pipefail
          python -u scripts/fetch.py 2>&1 | tee fetch.log
          python scripts/screen.py
          python scripts/sectors.py
          bash scripts/publish_data.sh us
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Korea data and history
        id: kr
        continue-on-error: true
        timeout-minutes: 240
        run: |
          set -o pipefail
          python -u scripts/fetch_kr.py 2>&1 | tee fetch_kr.log
          python scripts/screen_kr.py
          python scripts/sectors.py data/cache/kr docs/data_kr.json
          bash scripts/publish_data.sh kr
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cache
          key: cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report incomplete markets
        if: always()
        env:
          US_RESULT: ${{ steps.us.outcome }}
          KR_RESULT: ${{ steps.kr.outcome }}
        run: |
          if [ "$US_RESULT" != success ] || [ "$KR_RESULT" != success ]; then
            echo "::error::Market refresh incomplete: US=$US_RESULT KR=$KR_RESULT. Previously published data is preserved."
            exit 1
          fi
