name: debug
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: none
          restore-keys: cache-
      - run: |
          for c in 1067983 1381197 1141391 1326801 773840; do
            curl -s -A "$UA" https://data.sec.gov/api/xbrl/companyfacts/CIK$(printf %010d $c).json -o f$c.json; sleep 0.3
          done
          python3 - <<'PY'
          import json
          fin=json.load(open('data/cache/fin.json')); px=json.load(open('data/cache/prices.json')); lst=json.load(open('data/cache/listing.json'))
          for c in ('1067983','1381197','1141391','1326801','773840'):
              f=json.load(open(f'f{c}.json'))['facts']
              dei=f.get('dei',{}).get('EntityCommonStockSharesOutstanding',{}).get('units',{}).get('shares',[])
              d=sorted(dei,key=lambda e:(e['end'],e['filed']))[-4:]
              eps=[e for e in f.get('us-gaap',{}).get('EarningsPerShareBasic',{}).get('units',{}).get('USD/shares',[]) if e['form']=='10-K'][-2:]
              ni=[e for e in f.get('us-gaap',{}).get('NetIncomeLoss',{}).get('units',{}).get('USD',[]) if e['form']=='10-K'][-2:]
              msg=f"{c} {lst.get(c)} cache={ {k:fin.get(c,{}).get(k) for k in ('shares','eps_shares')} } close={px.get(c,{}).get('close')} DEI={[(e['end'],e['val'],e.get('accn')) for e in d]} EPS={[(e.get('start'),e['end'],e['val']) for e in eps]} NI={[(e.get('start'),e['end'],e['val']) for e in ni]}"
              print(f"::warning title=d{c}::{msg[:1500]}")
          PY
        env:
          UA: ${{ secrets.SEC_USER_AGENT }}
