name: debug
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: none
          restore-keys: cache-
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import json, sys, os, requests
          sys.path.insert(0, 'scripts')
          from lib import extract, shares_out, analyze
          import card_rules as cr
          UA={'User-Agent': os.environ['UA']}; px=json.load(open('data/cache/prices.json'))
          for t,cik in (('ZETA',1851003),('PCOR',1611052)):
              f=requests.get(f'https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json',headers=UA,timeout=60).json()['facts']
              s=analyze(extract(f),px.get(str(cik)),shares_out(f)); s['record']=True; s['fin']=False; s['stale']=False; s['wk']=px.get(str(cik),{}).get('wk'); cr.enrich(s)
              print('::warning title=c::'+json.dumps({'t':t,'buy':s['buy_eligible'],'turn':cr.loss_turnaround(s),'op':[s['prev2_op'],s['prev_op'],s['latest_op']],'F':s['fscore'],'items':s['fscore_items'],'hold':cr.hold_reasons(s),'loss':s['metrics']['expected_loss']},ensure_ascii=False))
          PY
        env:
          UA: ${{ secrets.SEC_USER_AGENT }}
