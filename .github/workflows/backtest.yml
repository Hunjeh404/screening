name: backtest
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_backtest tests.test_card_rules tests.test_fscore
      # 상장 목록·업종코드는 일일 실행 캐시를 쓴다
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: none
          restore-keys: cache-
      - uses: actions/cache/restore@v4
        with:
          path: data/bt
          key: bt-data-${{ github.run_id }}
          restore-keys: bt-data-
      - name: Collect data
        run: python -u scripts/bt_data.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/bt
          key: bt-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Backtest
        run: python -u scripts/backtest.py
      - name: Publish report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/backtest.html docs/backtest_trades_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "backtest: $(date +%F)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
